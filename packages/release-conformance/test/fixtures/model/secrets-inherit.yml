name: caller that inherits secrets
on: push
permissions: {}
jobs:
  inherit:
    permissions:
      contents: read
    uses: example-org/shared/.github/workflows/build.yml@v1
    secrets: inherit
  named:
    permissions:
      contents: read
    uses: example-org/shared/.github/workflows/build.yml@v1
    with:
      first: one
      second: two
    secrets:
      TOKEN_A: ${{ secrets.TOKEN_A }}
      TOKEN_B: ${{ secrets.TOKEN_B }}
