name: a search pattern beside a secret
on:
  push:
    branches: [main]
permissions: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - run: |
          ! grep -nE "npx |pnpm dlx" docs.txt
          sed -n '/npx/p' docs.txt
