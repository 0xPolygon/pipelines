name: a backticked runner in a body beside a secret
on:
  push:
    branches: [main]
permissions: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: acme/pr@v1
        with:
          body: |
            Run `npx changeset` to add a changeset.
