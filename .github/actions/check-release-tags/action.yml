name: Check release tags
description: >
  Confirms that every package listed in `<directory>/manifest.json` has a git
  tag on the remote repository, read through the GitHub REST API. A tag is
  accepted as `<name>@<version>` (multi-package repos) or `v<version>`
  (single-package repos). Fails with one error listing the missing tags.
  Safe to re-run: it only reads.

inputs:
  directory:
    description: Directory holding the manifest.json written by the pack action.
    required: true
  token:
    description: Token with read access to the repository's git refs.
    required: true

runs:
  using: composite
  steps:
    - name: Check tags exist
      shell: bash
      env:
        # Inputs and the action path are assigned to env vars before shell use
        # to prevent expression injection.
        ACTION_PATH: ${{ github.action_path }}
        TARBALL_DIRECTORY: ${{ inputs.directory }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: node "$ACTION_PATH/check-release-tags.mjs"
