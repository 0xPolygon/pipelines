name: Check @changesets/cli version
description: >
  Fails unless the repository's resolved `@changesets/cli` is a 2.x or 3.x
  release, and reports which one through the `major` output. On 3.x it also
  fails when the repository has private packages but `.changeset/config.json`
  does not set `privatePackages` explicitly. Run it after the dependency
  install, before any step that versions, tags or publishes.

outputs:
  major:
    description: "The resolved @changesets/cli major version: '2' or '3'."
    value: ${{ steps.check.outputs.major }}
  version:
    description: The resolved @changesets/cli version.
    value: ${{ steps.check.outputs.version }}

runs:
  using: composite
  steps:
    - name: Check @changesets/cli is 2.x or 3.x
      id: check
      shell: bash
      env:
        # Assign github.action_path to an env var before shell use to prevent
        # expression injection if the path contains special characters.
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/check-changesets-cli.mjs"
