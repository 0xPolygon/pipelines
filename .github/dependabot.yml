version: 2
updates:
  # Keeps the action pins in every workflow and composite action current. Callers
  # pick the new versions up when they bump their pin of this repo.
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # One pin of changesets/action stays on its current major for callers on the
    # older CLI; a new major is adopted by hand together with the release workflow.
    ignore:
      - dependency-name: 'changesets/action'
        update-types: ['version-update:semver-major']
    # Majors come as separate PRs: callers that use this repo at @main pick each
    # one up on merge, so it gets its own review.
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
