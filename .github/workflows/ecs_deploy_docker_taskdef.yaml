on:
  workflow_call:
    inputs:
      account_number:
        required: true
        type: string
      app_name:
        required: true
        type: string
      cluster_name:
        required: true
        type: string
      taskdef_file_vars:
        required: true
        type: string
        description: "Taskdef file variables passed from the app repository or use the local"
      docker_file:
        required: false
        type: string
        default: Dockerfile      
      taskdef_file_script:
        required: false
        default: "local"
        description: "Python script to handle task definition creation handling"
        type: string
      taskdef_file_template:
        required: false
        default: "local"
        description: "Taskdef file template passed from the app repository or use the local"
        type: string
      aws_region:
        required: false
        default: "eu-west-1"
        type: string
      environment:
        required: false
        default: "staging"
        type: string
      env_file_secret_var:
        required: false
        default: ""
        type: string
        description: "Variable name containing b64 encoded data for .env file"
    secrets:
      build_params_gh_secret_keys:
        required: false
        description: "Pass github secrets in json format for supporting docker build"
      
jobs:
  deploy_workflow:
    name: Deploy ${{ inputs.app_name }}
    permissions:
      id-token: write
      contents: write
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Support directory
        if: ${{ inputs.taskdef_file_script }} == "local"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: 0xPolygon/pipelines
          ref: main
          path: ./pipelines
          sparse-checkout: |
            Support/      
          
      - name: Checkout Code Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          path: ./code

      - name: Set up secrets
        env:
          BUILD_PARAMS_GH_SECRET_KEYS: ${{ secrets.build_params_gh_secret_keys }}
        run: |
          if [ -n "$BUILD_PARAMS_GH_SECRET_KEYS" ]; then
            # Callers store this secret either as plain JSON or with backslash-escaped
            # quotes. The former inline `echo "..."` unescaped \" \\ \$ and \` as
            # bash does inside double quotes; keep doing that for non-JSON input so
            # existing secrets keep working.
            secrets_json="$BUILD_PARAMS_GH_SECRET_KEYS"
            if ! jq -e . <<< "$secrets_json" > /dev/null 2>&1; then
              secrets_json="$(sed -E 's/\\([\\"$`])/\1/g' <<< "$secrets_json")"
            fi
            echo "$secrets_json" > secrets.json
          fi

      - name: Parse secrets and set environment variables
        run: |
          if [ -f secrets.json ]; then
            echo "Setting environment variables from JSON..."
            jq -r 'to_entries | .[] | "\(.key)=\(.value)"' secrets.json >> "$GITHUB_ENV"
            jq -r 'to_entries | .[] | "\(.key)=\(.value)"' secrets.json | tr '\n' '\r\n' > code/.env
          fi

      - name: Set up secrets from base64 encoded secret to .env file in code directory
        env:
          ENV_FILE_SECRET_VAR: ${{ inputs.env_file_secret_var }}
          ENV_FILE_SECRET_VALUE: ${{ secrets[inputs.env_file_secret_var] }}
        run: |
          if [[ -n "$ENV_FILE_SECRET_VAR" ]]; then
            echo "Fetching and decoding .env file data from secret.$ENV_FILE_SECRET_VAR"
            echo "$ENV_FILE_SECRET_VALUE" | base64 -d > code/.env
          fi

      - name: Set variables
        env:
          TASKDEF_FILE_SCRIPT_INPUT: ${{ inputs.taskdef_file_script }}
          TASKDEF_FILE_TEMPLATE_INPUT: ${{ inputs.taskdef_file_template }}
        run: |
          # These values are written to GITHUB_ENV below; a newline would let a value
          # inject extra variables.
          if [[ "$TASKDEF_FILE_SCRIPT_INPUT$TASKDEF_FILE_TEMPLATE_INPUT" == *[$'\r\n']* ]]; then
            echo "::error::taskdef_file_script/taskdef_file_template must not contain newlines"
            exit 1
          fi
          if [ "$TASKDEF_FILE_SCRIPT_INPUT" == "local" ]; then
            echo "taskdef_file_script=pipelines/Support/taskdef_template/taskdef_creator.py" >> "$GITHUB_ENV"
            echo "taskdef_file_template=pipelines/Support/taskdef_template/taskdef_template.json" >> "$GITHUB_ENV"
          else
            echo "taskdef_file_script=code/${TASKDEF_FILE_SCRIPT_INPUT}" >> "$GITHUB_ENV"
            echo "taskdef_file_template=code/${TASKDEF_FILE_TEMPLATE_INPUT}" >> "$GITHUB_ENV"
          fi

      - name: Create taskdef file dynamically using parameters passed
        env:
          TASKDEF_FILE_VARS: ${{ inputs.taskdef_file_vars }}
          ACCOUNT_NUMBER: ${{ inputs.account_number }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          # taskdef_file_script / taskdef_file_template are set by the previous step via GITHUB_ENV
          script_dir="$(dirname "$taskdef_file_script")"
          if [[ -z "$script_dir" ]]; then
            echo "Warning: Script name doesn't contain a directory path. Using current directory."
            script_dir="."
          fi
          export PIPENV_PIPFILE=$script_dir/Pipfile
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv install
          pipenv run python "$taskdef_file_script" \
            -pf "code/${TASKDEF_FILE_VARS}" -tt "$taskdef_file_template" \
            -acc "$ACCOUNT_NUMBER" -app "$APP_NAME"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: |
            arn:aws:iam::${{ inputs.account_number }}:role/${{ inputs.app_name }}-GithubActionsRole
          role-session-name: GithubActionsSession

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@5a88a04c91d5c6f97aae0d9be790e64d9b1d47b7 # v1.7.1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: "${{ github.sha }}-${{ github.run_id }}"
          ECR_REPOSITORY: ${{ inputs.app_name }}-ecr
          APP_NAME: ${{ inputs.app_name }}
          DOCKER_FILE: ${{ inputs.docker_file }}
        run: |
          # APP_NAME and taskdef_file_template are written to GITHUB_OUTPUT below; a newline
          # would let a value inject extra outputs.
          if [[ "$APP_NAME$taskdef_file_template" == *[$'\r\n']* ]]; then
            echo "::error::app_name/taskdef_file_template must not contain newlines"
            exit 1
          fi
          cd code
          current_dir=$(realpath .)
          target_dir=$(dirname "$(realpath "$DOCKER_FILE")")
          if [[ "$current_dir" != "$target_dir" ]]; then
            cd "$target_dir"
            docker_file_basename=$(basename "$DOCKER_FILE")
          else
            docker_file_basename=$(basename "$DOCKER_FILE")
          fi
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f $docker_file_basename .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "taskdef_file=$(dirname "$taskdef_file_template")/${APP_NAME}.json" >> "$GITHUB_OUTPUT"

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition: "${{ steps.build-image.outputs.taskdef_file }}"
          container-name: ${{ inputs.app_name }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@69e7aed9b8acdd75a6c585ac669c33831ab1b9a3 # v1.5.0
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ inputs.app_name }}-ecs-service
          cluster: ${{ inputs.cluster_name }}
          wait-for-service-stability: true
