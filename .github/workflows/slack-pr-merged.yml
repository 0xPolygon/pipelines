name: Slack PR merged

# Reacts in Slack when a PR merges. See .github/actions/slack-pr-merged for the rules.
# Callers trigger it on `pull_request: closed`; unmerged and fork PRs are skipped here.
on:
  workflow_call:
    inputs:
      channel-ids:
        description: Slack channel IDs to scan, separated by spaces, commas or newlines. Empty makes the job a no-op.
        type: string
        required: false
        default: ''
      lookback-days:
        type: number
        required: false
        default: 14
    secrets:
      SLACK_BOT_TOKEN:
        required: false
      PR_READ_TOKEN:
        description: Optional token that can read PRs in other repos; defaults to the caller's GITHUB_TOKEN.
        required: false

permissions:
  pull-requests: read

jobs:
  slack:
    name: Slack PR merged
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Runs the action from this workflow's own commit, so a caller that pins this
      # workflow to a SHA also pins the script. Anonymous fetch: pipelines is public.
      - name: Fetch the action at this workflow's commit
        env:
          WORKFLOW_REPO: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          git init -q .pipelines
          git -C .pipelines fetch -q --depth 1 "https://github.com/${WORKFLOW_REPO}.git" "$WORKFLOW_SHA"
          git -C .pipelines checkout -q FETCH_HEAD
      - uses: ./.pipelines/.github/actions/slack-pr-merged
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-ids: ${{ inputs.channel-ids }}
          github-token: ${{ secrets.PR_READ_TOKEN || github.token }}
          lookback-days: ${{ inputs.lookback-days }}
