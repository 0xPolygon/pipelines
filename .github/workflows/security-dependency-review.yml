name: Dependency review

# PR gate: fails when the PR adds a dependency with a high or critical advisory
# (runtime, development or unknown scope), or one whose licence is outside the
# shared allowlist below.
#
# The policy is fixed here, not in the caller: the thresholds take no inputs,
# and the only licence exemptions are those in
# .github/dependency-review/<owner>/<repo>.txt in this repository, reviewed by
# its code owners. A pull request in the calling repository cannot loosen
# either.
#
# Callers trigger it on `pull_request` (see security-dependency-review-trigger.yml).
# Needs the dependency graph: public repos, or private repos with GitHub Code Security.
on:
  workflow_call:

permissions: {}

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # comment-summary-in-pr
    steps:
      # Reads this repository at the workflow's own commit, so a caller that pins
      # this workflow to a SHA also pins its exemptions. Anonymous fetch: pipelines
      # is public. The caller's code is never checked out; the action reads the
      # PR's dependency diff through the API.
      - name: Fetch pipelines at this workflow's commit
        env:
          WORKFLOW_REPO: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          git init -q .pipelines
          git -C .pipelines fetch -q --depth 1 "https://github.com/${WORKFLOW_REPO}.git" "$WORKFLOW_SHA"
          git -C .pipelines checkout -q FETCH_HEAD
      - name: Read licence exemptions
        id: exemptions
        uses: ./.pipelines/.github/actions/dependency-review-exemptions
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          # Permissive licences GitHub reports across the npm and Go trees of the
          # repos that adopted this gate. Copyleft and unparsed licence data stay out.
          allow-licenses: >-
            MIT,
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            0BSD,
            MPL-2.0,
            Unlicense,
            CC0-1.0,
            BlueOak-1.0.0,
            BSD-2-Clause-Views,
            CC-BY-3.0,
            CC-BY-4.0,
            MIT-0,
            MITNFA,
            PostgreSQL,
            Python-2.0,
            Unicode-3.0,
            Zlib,
            LicenseRef-scancode-google-patent-license-golang
          allow-dependencies-licenses: ${{ steps.exemptions.outputs.allow-dependencies-licenses }}
          comment-summary-in-pr: on-failure
