name: npm release

# The release flow for Apps Team monorepos using changesets + pnpm deploy.
#
# A push to the default branch runs these jobs:
#
#   version   opens or updates the changesets "Release / Deploy" PR and
#             reports whether changesets are still pending.
#   build     runs once no changesets are pending. Packs every public
#             package whose version is not yet on npm into tarballs, with a
#             manifest, and uploads them as one artifact. Holds no publish
#             credential.
#   attest    runs only when there are tarballs. Downloads the artifact and
#             records a build provenance attestation for each tarball. It
#             checks out and installs no repository code.
#   publish   runs after attest. Downloads the artifact, verifies every
#             tarball's attestation, then publishes the tarballs with the npm
#             client that ships with the pinned Node version, authenticating
#             through OIDC trusted publishing. It checks out and installs no
#             repository code.
#   finalize  runs after publish (or straight after build when there was
#             nothing public to publish). Creates the git tag and GitHub
#             Release for each taggable package, so service repos that only
#             ship Docker images are tagged without waiting on a publish.
#
# No release-path job restores a dependency cache: every job installs from the
# committed lockfile.
#
# `createGithubReleases: true` extracts each version's `## <version>`
# section from the matching package's `CHANGELOG.md` and posts it as the
# release body — same canonical algorithm as changesets-action's
# upstream behaviour, no custom port required.

on:
  workflow_call:
    inputs:
      snapshot_tag:
        description: >
          npm dist-tag under which to publish a *throwaway prerelease
          snapshot* (e.g. `pre-3.9.8`, `canary`, `next-feature-x`).
          When set, the workflow runs the snapshot job (`changeset
          version --snapshot <tag>` then `changeset publish --tag <tag>
          --no-git-tag`) instead of the standard release job. Leave
          empty for a normal `push`-triggered release.

          **Must not be a semver-shaped value** (`3.9.8`, `v3.9.8`,
          `3.9.8-beta.1`, etc.) — the snapshot path bypasses the
          release pipeline (no git tag, no GitHub Release), so using a
          real version string would silently publish under that
          dist-tag without doing the rest of the release. The job
          validates the input and aborts on a semver-shaped value.
        type: string
        required: false
        default: ''
    secrets:
      CHANGESET_RELEASE_BOT_APP_ID:
        required: true
      CHANGESET_RELEASE_BOT_APP_PRIVATE_KEY:
        required: true

# Default-deny: every job below declares its own `permissions:`, so nothing
# here is inherited, and a job added later without a block gets no grant.
# Callers must still grant the union of the job-level blocks (contents write,
# pull-requests write, id-token write, attestations write) — a caller cannot grant less than a
# called job requests.
permissions: {}

jobs:
  version:
    # Opens or updates the changesets Release / Deploy PR. Skipped when
    # `snapshot_tag` is set — that's a snapshot publish handled below.
    if: inputs.snapshot_tag == ''
    runs-on: ubuntu-latest
    # Bounded: a git network call that cannot authenticate (e.g. changesets'
    # deepen loop, which ignores fetch failures) fails here, not at the
    # 6-hour default.
    timeout-minutes: 20
    permissions:
      contents: write # release PR commits and branch
      pull-requests: write # the changesets Release / Deploy PR
    outputs:
      has_changesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      # Fail before anything else runs unless this is a push to the default
      # branch. The guard comes from this workflow's own commit; the checkout
      # below clears the workspace, so this copy is gone before changesets runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipelines-guard
          sparse-checkout: .github/actions/release-guard
          persist-credentials: false

      - uses: ./.pipelines-guard/.github/actions/release-guard

      # Checkout with the default read-only job token and do not persist it
      # to .git/config: nothing after this step pushes over git (changesets
      # github-api mode writes through the API with the app token below).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          check-latest: true

      # Check out this workflow's own commit so the composite actions below run
      # from the same SHA as this workflow. A caller that pins this workflow
      # to a SHA then gets matching actions instead of whatever is on main.
      # `.pipelines` keeps it out of the caller's files at the workspace root.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipelines
          persist-credentials: false

      # A sibling dependency declared with a plain version range would be
      # resolved from the registry instead of this repo, and would break the
      # frozen install below as soon as `changeset version` bumps it. The PR
      # changeset check runs the same guard; repeating it here turns a stray
      # range into a clear error rather than a lockfile mismatch.
      - uses: ./.pipelines/.github/actions/check-workspace-protocol

      # changesets/action in github-api mode commits untracked files too, so
      # the pipelines checkout must be gone before it runs or it would land in
      # the Version Packages commit.
      - name: Remove the pipelines checkout
        run: rm -rf .pipelines .pipelines-guard

      # Frozen: the lockfile committed at the release-PR merge commit is the
      # one the release must install. `changeset version` leaves
      # `workspace:` ranges untouched (pnpm swaps in real versions only at
      # pack) and the only ranges it does bump, sibling peerDependencies,
      # are not recorded in the lockfile, so the lockfile is still current.
      # --ignore-scripts: no caller needs an install-time script to release
      # (root `prepare` only installs git hooks; allowlisted dependency builds
      # serve tests/lint/runtime, not `changeset version`), and skipping them
      # keeps dependency code from running in a job that holds a release token.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Token-ordering trap: mint the app token AFTER checkout and install,
      # never before. A token minted earlier is reachable from every later
      # step — checkout would persist it into .git/config, and any
      # dependency install script could read it. Minted here, it exists only
      # for changesets/action. Scope it to exactly what changesets/action
      # (github-api mode) uses: contents (commits, refs) and pull-requests
      # (release PR list/create/update).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.CHANGESET_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.CHANGESET_RELEASE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          title: 'changesets: Release / Deploy'
          commit: 'release: version packages'
          # github-api mode signs commits with GitHub's GPG key, satisfying
          # the repository's signed-commits requirement. git-cli (the
          # default) produces unsigned commits.
          commitMode: github-api
          # Keeps the release PR's "publish" wording. The command prints no
          # `New tag:` line, so this job creates no tags or Releases:
          # publishing happens in the build, publish and finalize jobs.
          publish: echo "Publishing continues in the build, publish and finalize jobs"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  build:
    # Runs once no changesets are pending (the push that merged the release
    # PR). Packs the unpublished public packages. It holds no publish
    # credential: the permissions below grant read access to this repo only.
    needs: version
    if: inputs.snapshot_tag == '' && needs.version.outputs.has_changesets == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    outputs:
      has_tarballs: ${{ steps.pack.outputs.has_tarballs }}
      count: ${{ steps.pack.outputs.count }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          check-latest: true

      # Frozen and scriptless, as in the version job.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Checked out after the install so the repo's package discovery and the
      # install never see it. See the version job for why it is this
      # workflow's own commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipelines
          persist-credentials: false

      # Tarballs and manifest.json go outside the checkout.
      - uses: ./.pipelines/.github/actions/npm-pack
        id: pack
        with:
          out-dir: ${{ runner.temp }}/npm-tarballs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.pack.outputs.has_tarballs == 'true'
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs
          if-no-files-found: error
          retention-days: 7

  attest:
    # Runs only when build packed at least one tarball. Records a build
    # provenance attestation for each tarball so publish can verify what it
    # publishes is what this workflow built. Checks out and installs no
    # repository code; the only checkout is this workflow's own release guard.
    needs: [version, build]
    if: inputs.snapshot_tag == '' && needs.build.outputs.has_tarballs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # sign the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipelines
          sparse-checkout: .github/actions/release-guard
          persist-credentials: false

      - uses: ./.pipelines/.github/actions/release-guard

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs

      # Tarballs only: manifest.json is not an artifact that gets published.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/npm-tarballs/*.tgz

  publish:
    # Runs only when build packed at least one tarball. Checks out and
    # installs no repository code: it downloads the artifact, verifies each
    # tarball's attestation, and publishes it with the npm client bundled with
    # the pinned Node version, using the runner's OIDC identity.
    needs: [version, build, attest]
    if: inputs.snapshot_tag == '' && needs.build.outputs.has_tarballs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment's reviewers approve the publish. A repository that
    # publishes public packages must configure `npm-publish` with required
    # reviewers, self-review prevented, no administrator bypass, and
    # deployment limited to the default branch. The workflow does not create
    # or configure the environment; verify it with
    # scripts/check-publish-environment.sh. The name is fixed (npm trust
    # configs pin it). A release with nothing public skips this job and asks
    # no approval.
    environment: npm-publish
    permissions:
      id-token: write # npm OIDC trusted publishing
      attestations: read # verify each tarball's attestation
    steps:
      # An exact Node version, so the bundled npm is the same on every run:
      # Node 24.22.3 ships npm 11.19.1, above the 11.5.1 that trusted
      # publishing requires (the publish action re-checks the version).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
          check-latest: false
          registry-url: 'https://registry.npmjs.org'
          # No node-auth-token — npm auth handled by OIDC

      # Only the publish action is needed from this workflow's own commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipelines
          sparse-checkout: |
            .github/actions/release-guard
            .github/actions/npm-publish-tarballs
          persist-credentials: false

      - uses: ./.pipelines/.github/actions/release-guard

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs

      - uses: ./.pipelines/.github/actions/npm-publish-tarballs
        with:
          directory: ${{ runner.temp }}/npm-tarballs

  finalize:
    # Creates the git tag and GitHub Release for each taggable package. Runs
    # after publish succeeds, or after build when there was nothing public to
    # publish (publish is then skipped, not failed).
    needs: [version, build, publish]
    if: >-
      always() && inputs.snapshot_tag == ''
      && needs.version.outputs.has_changesets == 'false'
      && needs.build.result == 'success'
      && (needs.publish.result == 'success'
          || (needs.publish.result == 'skipped'
              && needs.build.outputs.has_tarballs == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # tags and GitHub Releases
    steps:
      # Fail before anything else runs unless this is a push to the default
      # branch. The guard comes from this workflow's own commit; the checkout
      # below clears the workspace, so this copy is gone before changesets runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipelines-guard
          sparse-checkout: .github/actions/release-guard
          persist-credentials: false

      - uses: ./.pipelines-guard/.github/actions/release-guard

      # Same checkout as the version job: read-only job token, not persisted.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          check-latest: true

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Tags and Releases are created from the `New tag:` lines that
      # `changeset tag` prints in @changesets/cli 2.x, so finalize fails on any
      # other major, whether or not anything was published in this run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipelines
          sparse-checkout: .github/actions/check-changesets-cli
          persist-credentials: false

      - uses: ./.pipelines/.github/actions/check-changesets-cli

      - name: Remove the pipelines checkout
        run: rm -rf .pipelines

      # Minted after checkout and install, for changesets/action only, and
      # limited to tags and Releases.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.CHANGESET_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.CHANGESET_RELEASE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          title: 'changesets: Release / Deploy'
          commit: 'release: version packages'
          commitMode: github-api
          # `changeset tag` prints a `New tag:` line per untagged package;
          # the action creates each tag and a GitHub Release from the
          # package's CHANGELOG.md `## <version>` section.
          publish: pnpm exec changeset tag
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Verifies the end state rather than the action's outputs: every
      # package that was published has a git tag and a GitHub Release. Fails when a
      # repo's @changesets/cli prints tags in a format changesets/action
      # cannot read (it reads `New tag:` lines), and passes on a re-run after
      # the tags already exist.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.publish.result == 'success'
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.publish.result == 'success'
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipelines
          sparse-checkout: .github/actions/check-release-tags
          persist-credentials: false

      - uses: ./.pipelines/.github/actions/check-release-tags
        if: needs.publish.result == 'success'
        with:
          directory: ${{ runner.temp }}/npm-tarballs
          token: ${{ github.token }}

  snapshot:
    # Snapshot publish: bumps versions in-place on the runner (never
    # committed) and publishes under a custom dist-tag via OIDC. Used to
    # ship prereleases ahead of a real release tag — e.g. `pre-3.9.8`
    # consumed by a downstream service while the matching changeset is
    # still in review.
    #
    # Independent of the release job: snapshots don't push git tags or
    # create GitHub Releases. The standard release path remains the
    # only way to cut a real version.
    if: inputs.snapshot_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      # @changesets/changelog-github (used by most callers) looks up each
      # commit's associated PRs with github.token in `Version snapshot`; a
      # private/internal repo refuses that without pull-requests read.
      pull-requests: read # changelog PR lookups
      id-token: write # required for npm OIDC trusted publishing
    steps:
      # Refuse semver-shaped inputs. The snapshot path bypasses the
      # release pipeline entirely — using a real version string here
      # (e.g. `3.9.8`) would publish under that dist-tag without
      # pushing the git tag or creating a GitHub Release. Catching this
      # loudly is the whole point of the `snapshot_tag` rename.
      - name: Validate snapshot_tag
        env:
          SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
        shell: bash
        run: |
          if [[ "$SNAPSHOT_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([+-].*)?$ ]]; then
            echo "::error title=Invalid snapshot_tag::snapshot_tag '$SNAPSHOT_TAG' looks like a semver release version. The snapshot path bypasses the release pipeline (no git tag, no GitHub Release). For a real release, merge the changesets Release / Deploy PR. Use a non-semver dist-tag (e.g. 'pre-3.9.8', 'canary', 'next-feature-x')."
            exit 1
          fi

      # Credentials stay persisted here on purpose. `changeset version` finds the
      # commit that added each changeset through @changesets/git, which deepens
      # a shallow clone with `git fetch --deepen=50` in a loop that ignores the
      # fetch's exit code: on a private or internal caller an unauthenticated
      # fetch fails forever and the job hangs to its timeout (polygon-websites
      # hit this, 0xPolygon/polygon-websites#497). The persisted token is this
      # job's read-only github.token (contents: read, pull-requests: read), not
      # the release bot; the release job's changesets/action authenticates its
      # own deepen through ~/.netrc.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
          # No node-auth-token — npm auth handled by OIDC trusted publishing

      # Frozen for the same reason as the release job. The install runs
      # before `changeset version --snapshot`, which changes only `version`
      # fields on the runner and leaves `workspace:` ranges alone; pnpm
      # rewrites them to the 0.0.0-<tag>-<timestamp> versions at publish.
      # --ignore-scripts for the same reason as the release job: this job
      # also holds id-token: write.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # One authenticated deepen first, so broken git auth fails in seconds
      # instead of spinning changesets' deepen loop to the timeout.
      - name: Check git can fetch (changesets deepens this shallow clone)
        run: git fetch --deepen=1

      - name: Version snapshot
        # Bumps versions on the runner only — never committed.
        # `snapshot_tag` is user-controlled (workflow_dispatch input),
        # so route it through env: rather than `${{ ... }}` to avoid
        # script injection.
        env:
          SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
          # `changeset version` runs the repo's configured changelog formatter.
          # Repos on @changesets/changelog-github call the GitHub API (via
          # @changesets/get-github-info) and need a token, or `changeset version`
          # aborts. Read-only `github.token` suffices — the snapshot job never
          # commits or pushes (--no-git-tag). The release job sets this on the
          # changesets/action step; the snapshot job runs `changeset version`
          # directly and must set it too.
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: pnpm exec changeset version --snapshot "$SNAPSHOT_TAG"

      - name: Publish snapshot
        # `--snapshot` is intentionally NOT passed to `changeset publish`:
        # the publish command only destructures `{ otp, tag, gitTag }`
        # from its flags. In `@changesets/cli` ≤2.30.x `--snapshot` is
        # silently dropped; in ≥2.31.0 a `validateCommandFlags` step
        # rejects it as an unknown flag (exit 1). The previous `version`
        # step is the only place `--snapshot` is meaningful — it
        # produces the `0.0.0-<tag>-<timestamp>` runner-local version
        # that publish then ships under the dist-tag below.
        #
        # `--no-git-tag` because a snapshot is ephemeral; tagging the
        # runner state would clutter the repo with disposable refs and
        # risk triggering downstream tag-driven workflows.
        env:
          SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
        shell: bash
        run: pnpm exec changeset publish --tag "$SNAPSHOT_TAG" --no-git-tag
