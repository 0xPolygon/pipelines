name: Notify Slack on merge to main

on:
  workflow_call:
    inputs:
      pr-number:
        type: number
        required: true
      is-test:
        type: boolean
        required: true
      developer-note:
        type: string
        required: false
        default: ''
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PR data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: gh api "/repos/$REPOSITORY/pulls/$PR_NUMBER" > pr.json

      # Check out this workflow's own commit so the composite actions below run
      # from the same SHA as this workflow. A caller that pins this workflow
      # to a SHA then gets matching actions instead of whatever is on main.
      # `.pipelines` keeps it out of the caller's files at the workspace root.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipelines
          persist-credentials: false

      - uses: ./.pipelines/.github/actions/slack-notify
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          is-test: ${{ inputs.is-test }}
          developer-note: ${{ inputs.developer-note }}
