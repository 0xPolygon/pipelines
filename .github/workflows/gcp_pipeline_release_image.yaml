# Docker image release into GCP Artifact Registry.
#
# Each target platform is built on a runner of its own CPU architecture and
# pushed by digest; a final job stitches those digests into one tagged
# multi-platform manifest. Building arm64 under QEMU on an amd64 runner ran a
# service's TypeScript compile ~8x slower than native (471s vs 58s on identical
# source) and dominated every release, so emulation is deliberately not used.

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string

      image_tag:
        required: false
        type: string

      environment:
        required: false
        type: string
        default: ""

      dockerfile_path:
        required: false
        default: "Dockerfile"
        type: string
        description: "Path to the Dockerfile"

      dockerfile_context:
        required: false
        default: "."
        type: string
        description: "Context for dockerfile"

      checkout_ref:
        required: false
        type: string

      platforms:
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
        description: "Comma-separated target platforms; each is built natively on its own runner"

      runner_amd64:
        required: false
        type: string
        default: "ubuntu-latest"
        description: "runs-on label for linux/amd64 builds"

      runner_arm64:
        required: false
        type: string
        default: "ubuntu-24.04-arm"
        description: "runs-on label for linux/arm64 builds. GitHub's standard arm64 runner by default; pass a larger-runner label for more vCPUs"

    secrets:
      build_params_gh_secret_keys:
        required: false
        description: "Pass github secrets in json format for supporting docker build"

env:
  REGISTRY: europe-west2-docker.pkg.dev/prj-polygonlabs-shared-prod/polygonlabs-docker-prod
  IMAGE_NAME: ${{ inputs.image_name }}
  OIDC_PROVIDER: projects/23849419004/locations/global/workloadIdentityPools/polygonlabs-shared-prod/providers/oidc-shared-prod
  OIDC_SERVICE_ACCOUNT: shared-prod-oidc-sa@prj-polygonlabs-shared-prod.iam.gserviceaccount.com

jobs:
  prepare:
    name: Resolve platforms, tags and build provenance
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.matrix }}
      tag_config: ${{ steps.metadata-tags.outputs.tag_config }}
      git_sha: ${{ steps.provenance.outputs.git_sha }}
      built_at: ${{ steps.provenance.outputs.built_at }}
    steps:
      - name: Checkout
        if: inputs.checkout_ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Checkout
        if: inputs.checkout_ref == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the platform matrix
        id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          matrix=$(jq -cn --arg p "$PLATFORMS" '$p | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

      - name: Construct metadata tags input
        id: metadata-tags
        run: |
          echo 'tag_config<<EOF' >> $GITHUB_OUTPUT

          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "type=raw,value=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "type=ref,event=branch" >> $GITHUB_OUTPUT
            echo "type=ref,event=pr" >> $GITHUB_OUTPUT
            echo "type=semver,pattern={{version}}" >> $GITHUB_OUTPUT
            echo "type=semver,pattern={{major}}.{{minor}}" >> $GITHUB_OUTPUT
          fi

          echo 'EOF' >> $GITHUB_OUTPUT

      # Build provenance for images whose Dockerfiles declare GIT_SHA/BUILT_AT
      # args (services boot-log them as their build identity). Resolved from
      # the CHECKED-OUT ref, not github.sha — on workflow_dispatch re-runs the
      # two differ, and stamping the wrong sha is worse than "unknown".
      # Resolved once here so every platform's image carries the same values.
      # Dockerfiles without these args just log an unused-build-arg warning.
      - name: Resolve build provenance
        id: provenance
        run: |
          echo "git_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.platform == 'linux/arm64' && inputs.runner_arm64 || inputs.runner_amd64 }}
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    steps:
      - name: Checkout
        if: inputs.checkout_ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref }}
          submodules: recursive

      - name: Checkout
        if: inputs.checkout_ref == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # build_params_gh_secret_keys is a JSON object of KEY -> value. The runner
      # only masks that blob as a whole, not the values once they are reformatted
      # (KEY=VALUE lines), so every value is registered with ::add-mask:: first --
      # one call per line, since a mask only matches a single line -- and only
      # then written anywhere. Nothing derived from the values is ever echoed.
      # The JSON arrives through env: rather than being interpolated into the
      # script, so its content is never parsed as shell. Do not add `cat .env`,
      # `env`, `set -x` or similar to this step.
      - name: Set up secrets and environment variables
        env:
          BUILD_PARAMS_SECRETS: ${{ secrets.build_params_gh_secret_keys }}
        run: |
          set -euo pipefail
          umask 077

          if [ -z "$BUILD_PARAMS_SECRETS" ]; then
            exit 0
          fi

          # Callers have historically stored this either as plain JSON or with
          # backslash-escaped quotes (which the old inline `echo "..."` unescaped).
          # Accept both. Input is slurped so it must be exactly one JSON object
          # (jq -e only checks the last output). jq's stderr is discarded
          # because its errors can quote fragments of the input.
          json="$BUILD_PARAMS_SECRETS"
          if ! jq -s -e 'length == 1 and (.[0] | type == "object")' <<< "$json" > /dev/null 2>&1; then
            json="${json//\\\"/\"}"
            if ! jq -s -e 'length == 1 and (.[0] | type == "object")' <<< "$json" > /dev/null 2>&1; then
              echo "::error::build_params_gh_secret_keys is not a valid JSON object"
              exit 1
            fi
          fi

          # A NUL in a key or value would shift the NUL-delimited pairing below.
          if ! jq -s -e '.[0] | all(to_entries[]; [.key, "\(.value)"] | all(explode | index([0]) == null))' <<< "$json" > /dev/null 2>&1; then
            echo "::error::build_params_gh_secret_keys contains a NUL character"
            exit 1
          fi

          # NUL-delimited key/value pairs, so values keep embedded and trailing
          # newlines intact. Value rendering matches the former "\(.value)".
          entries() {
            jq -j 'to_entries[] | "\(.key)\u0000\(.value)\u0000"' <<< "$json" 2>/dev/null
          }

          # Pass 1: mask. Runs before anything is written or exported.
          while IFS= read -r -d '' key && IFS= read -r -d '' value; do
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              [[ "$line" =~ [^[:space:]] ]] || continue
              # Workflow-command data is %-decoded by the runner; escape so the
              # mask matches the literal text. A bare CR would end the command
              # early (the runner splits stdout on it), so send it as %0D and
              # let the runner mask each piece.
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/%0D}"
              echo "::add-mask::${line}"
            done <<< "$value"
          done < <(entries)

          # Pass 2: write. GITHUB_ENV uses a random heredoc delimiter so a
          # multi-line value cannot inject additional variables.
          : > .env
          printf '%s' "$json" > secrets.json
          while IFS= read -r -d '' key && IFS= read -r -d '' value; do
            if [ -z "$key" ] || [[ "$key" == *=* || "$key" == *'<<'* || "$key" == *$'\n'* || "$key" == *$'\r'* ]]; then
              echo "::error::build_params_gh_secret_keys contains an invalid key name"
              exit 1
            fi
            delim="ghadelim_$(openssl rand -hex 16)"
            {
              printf '%s<<%s\n' "$key" "$delim"
              printf '%s\n' "$value"
              printf '%s\n' "$delim"
            } >> "$GITHUB_ENV"
            # .env keeps its existing format: one KEY=VALUE per record, each
            # terminated with a carriage return (the old `tr '\n' '\r'`).
            printf '%s=%s\r' "$key" "${value//$'\n'/$'\r'}" >> .env
          done < <(entries)

      # Artifact names and cache scopes cannot contain "/".
      - name: Derive platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Authenticate with GCP via OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.OIDC_PROVIDER }}
          service_account: ${{ env.OIDC_SERVICE_ACCOUNT }}

      - name: Configure Artifact Registry authentication
        run: |
          echo '{"credHelpers": {"europe-west2-docker.pkg.dev": "gcloud"}}' > ~/.docker/config.json

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ needs.prepare.outputs.tag_config }}
          flavor: |
            latest=false

      # Pushed by digest only. Tags are applied to the merged manifest in the
      # next job, so a tag never points at a single-platform image, and a
      # failure in either platform leaves the tag unpublished rather than
      # half-published. The cache scope is per image and platform so parallel
      # legs (and sibling images released from the same repo) never overwrite
      # each other's cache index.
      - name: Build and push ${{ matrix.platform }} by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          file: ${{ inputs.dockerfile_path }}
          context: ${{ inputs.dockerfile_context }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ needs.prepare.outputs.git_sha }}
            BUILT_AT=${{ needs.prepare.outputs.built_at }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}-${{ env.PLATFORM_SLUG }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.IMAGE_NAME }}-${{ env.PLATFORM_SLUG }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Push multi-platform manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ env.IMAGE_NAME }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Authenticate with GCP via OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.OIDC_PROVIDER }}
          service_account: ${{ env.OIDC_SERVICE_ACCOUNT }}

      - name: Configure Artifact Registry authentication
        run: |
          echo '{"credHelpers": {"europe-west2-docker.pkg.dev": "gcloud"}}' > ~/.docker/config.json

      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ needs.prepare.outputs.tag_config }}
          flavor: |
            latest=false

      # The digest files are named by their sha256 hex, so the glob expands to
      # one image reference per platform.
      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect the pushed manifest
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
