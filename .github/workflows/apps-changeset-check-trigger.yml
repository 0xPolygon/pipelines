# A consuming repository replaces the local path below with
# 0xPolygon/pipelines/.github/workflows/apps-changeset-check.yml
# (the local form is used here because this file also runs in this repository).
name: Changeset check Trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    uses: ./.github/workflows/apps-changeset-check.yml
